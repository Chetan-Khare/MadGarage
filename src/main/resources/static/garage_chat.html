<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Garage Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .chat-container { height: 60vh; overflow-y: auto; background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 20px; max-width: 80%; }
        .user-message { background-color: #0d6efd; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #e9ecef; color: black; margin-right: auto; border-bottom-left-radius: 2px; }
        .image-preview { max-width: 150px; border-radius: 10px; display: none; margin-top: 10px; }
        .uploaded-img { max-width: 200px; border-radius: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-dark text-white fw-bold">
                    <i class="bi bi-robot me-2"></i> Garage Assistant
                </div>

                <div class="card-body">
                    <div id="chatBox" class="chat-container mb-3">
                        <div class="message ai-message">
                            Hello! Upload a photo of your car and tell me what part you are looking for.
                        </div>
                    </div>

                    <img id="imagePreview" class="image-preview mb-2" src="" alt="Preview">

                    <div class="input-group">
                        <label class="input-group-text bg-light cursor-pointer" for="imageUpload">
                            <i class="bi bi-paperclip fs-5"></i>
                        </label>
                        <input type="file" id="imageUpload" class="d-none" accept="image/*">
                        <input type="text" id="userInput" class="form-control" placeholder="Type your message...">
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <i class="bi bi-send-fill"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="chat_logic.js"></script>
</body>
</html>
