<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mad Garage - Seller Central</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f0f2f5; display: flex; }

        /* Sidebar layout */
        .sidebar { width: 250px; background: #1a1a2e; color: white; height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { color: #e94560; margin-top: 0; }

        /* Main Content layout */
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; height: 100vh; box-sizing: border-box; }

        /* Dashboard Cards */
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #0f3460; }
        .stat-card h3 { margin: 0; font-size: 14px; color: #666; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: #1a1a2e; }

        /* Layout Grid for Table and Form */
        .dashboard-grid { display: flex; gap: 30px; align-items: flex-start; }

        /* Inventory Table */
        .inventory-section { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #333; }
        .low-stock { color: #e94560; font-weight: bold; }

        /* Add Part Form */
        .form-section { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 6px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #0f3460; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; padding: 12px; }
        button:hover { background: #1a1a2e; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Mad Garage</h2>
    <p>Seller Central</p>
    <hr style="border-color: #333;">
    <p>📊 Dashboard</p>
    <p>📦 Inventory</p>
    <p>🛒 Orders (Coming Soon)</p>
</div>

<div class="main-content">
    <h1>Inventory Management</h1>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Unique Parts</h3>
            <p id="totalPartsStat">0</p>
        </div>
        <div class="stat-card" style="border-left-color: #e94560;">
            <h3>Total Stock Items</h3>
            <p id="totalStockStat">0</p>
        </div>
        <div class="stat-card" style="border-left-color: #28a745;">
            <h3>Total Inventory Value</h3>
            <p id="totalValueStat">₹0</p>
        </div>
    </div>

    <div class="dashboard-grid">

        <div class="inventory-section">
            <h2>Current Stock</h2>
            <table>
                <thead>
                <tr>
                    <th>SKU</th>
                    <th>Part Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                </tr>
                </thead>
                <tbody id="inventoryTableBody">
                </tbody>
            </table>
        </div>

        <div class="form-section">
            <h2>Add New Part</h2>
            <form id="addPartForm" enctype="multipart/form-data">
                <label>SKU</label>
                <input type="text" id="sku" placeholder="MG-BRK-009" required>

                <label>Brand & Name</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="brand" placeholder="Brand" required>
                    <input type="text" id="partName" placeholder="Name" required>
                </div>

                <label>Category</label>
                <select id="category">
                    <option value="Brakes">Brakes</option>
                    <option value="Engine">Engine</option>
                    <option value="Filters">Filters</option>
                    <option value="Suspension">Suspension</option>
                    <option value="Body Parts">Body Parts</option>
                </select>

                <label>Price (₹) & Stock Quantity</label>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="price" placeholder="Price" required>
                    <input type="number" id="stockQuantity" placeholder="No. of Pieces" required>
                </div>

                <label>Color (Optional)</label>
                <input type="text" id="color" placeholder="Leave blank if not applicable">

                <label>Description</label>
                <textarea id="description" rows="2" required></textarea>

                <label>Product Photo</label>
                <input type="file" id="image" accept="image/*" required>

                <label>Compatible Vehicles (Hold CTRL)</label>
                <select id="vehicleIds" multiple style="height: 60px;" required>
                    <option value="1">2019 Hyundai Creta (Diesel)</option>
                    <option value="2">2020 Kia Seltos (Diesel)</option>
                    <option value="3">2022 Maruti Swift (Petrol)</option>
                </select>

                <button type="submit">➕ Add to Inventory</button>
            </form>
        </div>

    </div>
</div>

<script>
    // 1. Function to fetch and display current inventory
    async function loadInventory() {
        try {
            const response = await fetch('/api/seller/inventory');
            const parts = await response.json();

            const tableBody = document.getElementById('inventoryTableBody');
            tableBody.innerHTML = ''; // Clear table

            let totalStock = 0;
            let totalValue = 0;

            parts.forEach(part => {
                // Update stats
                const stock = part.stockQuantity || 0;
                totalStock += stock;
                totalValue += (part.price * stock);

                // Build table row
                const row = document.createElement('tr');
                const stockText = stock <= 5 ? `<span class="low-stock">${stock} (Low!)</span>` : stock;

                row.innerHTML = `
                    <td><strong>${part.sku}</strong></td>
                    <td>${part.brand} ${part.partName}</td>
                    <td>${part.category}</td>
                    <td>₹${part.price.toFixed(2)}</td>
                    <td>${stockText}</td>
                `;
                tableBody.appendChild(row);
            });

            // Update top cards
            document.getElementById('totalPartsStat').innerText = parts.length;
            document.getElementById('totalStockStat').innerText = totalStock;
            document.getElementById('totalValueStat').innerText = '₹' + totalValue.toLocaleString('en-IN');

        } catch (error) {
            console.error("Error loading inventory:", error);
        }
    }

    // 2. Handle the Add Part Form Submission
    document.getElementById('addPartForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData();
        formData.append("sku", document.getElementById('sku').value);
        formData.append("brand", document.getElementById('brand').value);
        formData.append("partName", document.getElementById('partName').value);
        formData.append("category", document.getElementById('category').value);
        formData.append("price", document.getElementById('price').value);
        formData.append("stockQuantity", document.getElementById('stockQuantity').value); // New Stock Field
        formData.append("description", document.getElementById('description').value);
        formData.append("color", document.getElementById('color').value);
        formData.append("image", document.getElementById('image').files[0]);

        const selectedVehicles = Array.from(document.getElementById('vehicleIds').selectedOptions).map(opt => opt.value);
        selectedVehicles.forEach(id => formData.append("vehicleIds", id));

        try {
            const response = await fetch('/api/seller/inventory', { method: 'POST', body: formData });
            if(response.ok) {
                alert("Part added successfully!");
                document.getElementById('addPartForm').reset();
                loadInventory(); // Instantly refresh the table!
            } else {
                alert("Error adding part.");
            }
        } catch (error) {
            alert("Could not connect to the server.");
        }
    });

    // Load inventory as soon as the page opens!
    window.onload = loadInventory;
</script>
</body>
</html>
