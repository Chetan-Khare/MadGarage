spring:
  application:
    name: mad-garage-api

  cache:
    type: caffeine
    cache-names: vehicle_makes,vehicle_models,vehicle_years,vehicle_fuels,vehicle_trims,vehicle_engines,products,products_garage,settings,publicConfig
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Database Setup (MySQL 8.0)
  datasource:
    url: jdbc:mysql://localhost:3306/madgarage?serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Spring Boot 3 SQL Initialization
  sql:
    init:
      mode: never # We use Flyway (V2__seed_data.sql) instead of data.sql

  # Hibernate (Database ORM) Setup
  # P0 FIX: Changed from 'update' to 'validate' for absolute Flyway control.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false # Prevent startup failure due to checksum mismatch on existing scripts.

  # Spring AI Setup (Gemma 4 via Google AI Studio)
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:DISABLED} # FALLBACK IF NO KEY IS PROVIDED
        chat:
          options:
            model: ${SPRING_AI_MODEL:gemma-4-26b}

# Tomcat connector config — remove default file-part count limit for multi-image uploads
server:
  tomcat:
    max-parameter-count: -1
    max-http-form-post-size: -1
    max-swallow-size: -1

  # Cost Optimization: Enable GZIP compression to reduce JSON payload size by ~70%
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  level:
    org.apache.tomcat: INFO
    org.springframework.web.multipart: INFO

# P1 FIX: JWT secret has NO fallback value.
# The app will throw IllegalArgumentException on startup if JWT_SECRET env var is missing.
# This is the correct "fail fast" behavior — never allow a weak default secret in any env.
app:
  jwt:
    secret: ${JWT_SECRET} # SECURE: Will crash on startup if missing, preventing default secret attacks
  seed:
    password: ${SEED_PASSWORD:password123}
  pricing:
    shipping-fee: 250.0
    garage-discount: 0.05
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}

# END OF FILE