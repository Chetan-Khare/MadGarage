spring:
  application:
    name: mad-garage-api
  
  devtools:
    restart:
      exclude: static/**,public/**,data/**
    remote:
      restart:
        enabled: false

  cache:
    type: caffeine
    cache-names: vehicle_makes,vehicle_models,vehicle_years,vehicle_fuels,vehicle_trims,vehicle_engines,products,products_garage,settings,publicConfig
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  # Database Setup (MySQL 8.0)
  datasource:
    url: jdbc:mysql://localhost:3306/madgarage?serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      max-lifetime: 580000 # Retire connections before MySQL (600s) kills them
      connection-timeout: 20000 # 20 seconds

  # Spring Boot 3 SQL Initialization
  sql:
    init:
      mode: never # We use Flyway (V2__seed_data.sql) instead of data.sql

  # Hibernate (Database ORM) Setup
  # P0 FIX: Changed from 'update' to 'validate' for absolute Flyway control.
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false # Prevent startup failure due to checksum mismatch on existing scripts.
  thymeleaf:
    check-template-location: false

  # Spring AI Setup (Google Gemini API)
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash

# Tomcat connector config — remove default file-part count limit for multi-image uploads
server:
  tomcat:
    max-parameter-count: -1
    max-http-form-post-size: -1
    max-swallow-size: -1

  # Cost Optimization: Enable GZIP compression to reduce JSON payload size by ~70%
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  # Log files are written here. Override with LOGGING_FILE_PATH env var on the server.
  # Rotation, retention (14 days), and level control live in logback-spring.xml.
  file:
    path: ${LOGGING_FILE_PATH:logs}
  level:
    # Ensure Flyway migration steps stay visible at startup
    org.flywaydb: INFO
    # Our application code — INFO by default; logback-spring.xml overrides to DEBUG in 'local' profile
    com.madgarage: INFO

# P1 FIX: JWT secret has NO fallback value.
# The app will throw IllegalArgumentException on startup if JWT_SECRET env var is missing.
# This is the correct "fail fast" behavior — never allow a weak default secret in any env.
app:
  jwt:
    secret: ${JWT_SECRET} # SECURE: Will crash on startup if missing, preventing default secret attacks
  seed:
    password: ${SEED_PASSWORD:password123}
  pricing:
    shipping-fee: 250.0
    garage-discount: 0.05
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}

# END OF FILE